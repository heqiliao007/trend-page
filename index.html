"<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending 实时解读</title>
<style>
  :root {
    --bg: #0b0b12;
    --surface: #12121e;
    --border: #1e1e30;
    --text: #e2e2ee;
    --text-dim: #6b6b84;
    --accent: #38bdf8;
    --accent-dim: #1e3a5f;
    --gold: #f59e0b;
    --green: #4ade80;
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    padding: 56px 24px 40px;
    text-align: center;
    background: linear-gradient(180deg, #0f0f20 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent); }
  .header .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .header-meta {
    display: flex; justify-content: center; gap: 20px;
    margin-top: 14px; font-size: 11px; color: var(--text-dim);
  }
  .container { max-width: 720px; margin: 0 auto; padding: 28px 20px 48px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .repo {
    font-size: 15px; font-weight: 500; color: var(--accent); text-decoration: none;
  }
  .repo:hover { text-decoration: underline; }
  .rank {
    font-size: 11px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .badges {
    display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap;
  }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 3px;
    background: rgba(255,255,255,0.04); color: var(--text-dim);
  }
  .badge-stars { color: var(--gold); }
  .badge-forks { color: var(--green); }
  .badge-topic {
    background: var(--accent-dim); color: var(--accent);
  }
  .desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
    margin-bottom: 12px;
  }
  .interp {
    border-left: 2px solid var(--accent-dim);
    padding-left: 14px;
  }
  .interp p {
    font-size: 13px; color: #c8c8d8; line-height: 1.8; margin-bottom: 4px;
  }
  .interp p:last-child { margin-bottom: 0; }
  .stats {
    display: flex; gap: 16px; margin-top: 10px; font-size: 11px; color: var(--text-dim);
    flex-wrap: wrap;
  }
  .summary-line {
    font-size: 14px; font-weight: 500; color: #e2e2ee;
    margin-bottom: 8px; line-height: 1.6;
  }
  .loading, .error {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim); font-size: 14px;
  }
  .error { color: #ef4444; }
  .footer {
    text-align: center; padding: 32px;
    font-size: 11px; color: var(--text-dim);
    border-top: 1px solid var(--border);
    max-width: 720px; margin: 0 auto;
  }
  .refresh-btn {
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 16px; font-size: 12px; cursor: pointer;
    margin-left: 12px; transition: background 0.2s;
  }
  .refresh-btn:hover { background: #1e4a7a; }
  .repo-link { color: var(--accent-dim); font-size: 11px; text-decoration: none; }
  .repo-link:hover { text-decoration: underline; color: var(--accent); }

  @media (max-width: 768px) {
    .header { padding: 40px 16px 28px; }
    .header h1 { font-size: 22px; }
    .container { padding: 20px 12px 36px; }
    .card { padding: 18px 16px; }
    .repo { font-size: 14px; }
  }
  @media (max-width: 420px) {
    .header h1 { font-size: 18px; }
    .card { padding: 14px 12px; }
    .interp p { font-size: 12px; }
    .summary-line { font-size: 13px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>GitHub Trending <span>实时解读</span></h1>
  <p class="sub" id="dateLabel">加载中...</p>
  <div class="header-meta">
    <span id="countLabel">-</span>
    <span>自动刷新获取最新趋势</span>
    <button class="refresh-btn" onclick="fetchTrending()">刷新</button>
  </div>
</div>

<div class="container" id="container">
  <div class="loading">正在获取 GitHub 热门项目数据...</div>
</div>

<div class="footer">Hermes Agent · 每次刷新自动获取最新数据</div>

<script>
async function fetchTrending() {
  const container = document.getElementById('container');
  container.innerHTML = '<div class="loading">正在获取 GitHub 热门项目数据...</div>';

  try {
    const today = new Date();
    document.getElementById('dateLabel').textContent = today.toISOString().split('T')[0];

    const oneWeekAgo = new Date(today);
    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
    const sinceStr = oneWeekAgo.toISOString().split('T')[0];

    const res = await fetch(
      `https://api.github.com/search/repositories?q=pushed:>${sinceStr}&sort=stars&order=desc&per_page=10`,
      { headers: { 'Accept': 'application/vnd.github.v3+json' } }
    );

    if (!res.ok) throw new Error(`API 请求失败 (${res.status})`);

    const data = await res.json();
    const repos = data.items;

    document.getElementById('countLabel').textContent = repos.length + ' 个项目';

    if (!repos || repos.length === 0) {
      container.innerHTML = '<div class="error">未获取到数据，请稍后重试</div>';
      return;
    }

    // 生成一句话总结 + 详细解读
    function generateInsight(repo) {
      const name = repo.full_name;
      const lang = repo.language || '';
      const desc = (repo.description || '').trim();
      const topics = repo.topics || [];
      const stars = repo.stargazers_count.toLocaleString();
      const forks = repo.forks_count;
      
      // ===== 一句话总结（基于描述 + 项目名 + 主题推断） =====
      let summary = '';
      
      if (desc) {
        // 英文描述本身已经说明了项目用途，直接用作总结
        summary = desc;
      } else {
        // 没有描述时，从项目名推断
        const nameLower = name.toLowerCase();
        if (nameLower.includes('db') || nameLower.includes('database') || nameLower.includes('sql') || nameLower.includes('redis')) {
          summary = '一个数据库或数据存储相关的工具/库';
        } else if (nameLower.includes('ai') || nameLower.includes('gpt') || nameLower.includes('llm') || nameLower.includes('chat') || nameLower.includes('agent')) {
          summary = '一个 AI / 大语言模型相关的工具或框架';
        } else if (nameLower.includes('cli') || nameLower.includes('terminal') || nameLower.includes('command')) {
          summary = '一个命令行工具或终端应用';
        } else if (nameLower.includes('ui') || nameLower.includes('component') || nameLower.includes('design') || nameLower.includes('css')) {
          summary = '一个 UI 组件库或前端设计工具';
        } else if (nameLower.includes('learn') || nameLower.includes('tutorial') || nameLower.includes('course') || nameLower.includes('guide')) {
          summary = '一个编程学习教程或技术指南';
        } else if (nameLower.includes('game') || nameLower.includes('engine')) {
          summary = '一个游戏或游戏引擎';
        } else if (nameLower.includes('framework') || nameLower.includes('sdk') || nameLower.includes('toolkit')) {
          summary = '一个开发框架或工具集';
        } else if (nameLower.includes('docker') || nameLower.includes('kubernetes') || nameLower.includes('k8s') || nameLower.includes('deploy')) {
          summary = '一个 DevOps / 容器化部署工具';
        } else if (nameLower.includes('test') || nameLower.includes('benchmark')) {
          summary = '一个测试或性能基准工具';
        } else {
          summary = `一个使用 ${lang} 开发的开源项目`;
        }
      }
      
      // ===== 详细解读 =====
      let details = [];
      
      // 技术背景
      if (lang) {
        details.push(`采用 ${lang} 开发`);
      }
      
      // 热度
      if (stars) {
        details.push(`当前获得 ${stars} 颗星标`);
      }
      if (forks > 500) {
        details.push(`已被复刻 ${forks} 次`);
      }
      
      // 主题标签
      if (topics.length > 0) {
        details.push(`涉及 ${topics.slice(0, 3).join('、')} 等领域`);
      }
      
      return { summary, details: details.join('，') };
    }

    let html = '';
    repos.forEach((repo, i) => {
      const stars = repo.stargazers_count.toLocaleString();
      const forks = repo.forks_count.toLocaleString();
      const lang = repo.language || '通用';
      const rank = String(i + 1).padStart(2, '0');
      const topics = (repo.topics || []).slice(0, 5);
      const insight = generateInsight(repo);

      html += `
        <div class="card">
          <div class="card-top">
            <a class="repo" href="${repo.html_url}" target="_blank">${repo.full_name}</a>
            <span class="rank">#${rank}</span>
          </div>
          <div class="badges">
            <span class="badge">${lang}</span>
            <span class="badge badge-stars">${stars} ★</span>
            <span class="badge badge-forks">${forks} ⑂</span>
            ${topics.map(t => `<span class="badge badge-topic">${t}</span>`).join('')}
          </div>
          <div class="summary-line">${insight.summary}</div>
          <div class="interp">
            <p>${insight.details}</p>
          </div>
          <div class="stats">
            <span>更新于 ${new Date(repo.pushed_at).toLocaleDateString('zh-CN')}</span>
            <a class="repo-link" href="${repo.html_url}" target="_blank">查看仓库 →</a>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

  } catch (err) {
    container.innerHTML = `<div class="error">获取失败：${err.message}</div>`;
  }
}

fetchTrending();
</script>
</body>
</html>"
