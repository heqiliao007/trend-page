"<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending 实时解读</title>
<style>
  :root {
    --bg: #0b0b12;
    --surface: #12121e;
    --border: #1e1e30;
    --text: #e2e2ee;
    --text-dim: #6b6b84;
    --accent: #38bdf8;
    --accent-dim: #1e3a5f;
    --gold: #f59e0b;
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    padding: 56px 24px 40px;
    text-align: center;
    background: linear-gradient(180deg, #0f0f20 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  .header h1 {
    font-size: 24px; font-weight: 600; letter-spacing: -0.3px;
  }
  .header h1 span { color: var(--accent); }
  .header .sub {
    font-size: 13px; color: var(--text-dim); margin-top: 4px;
  }
  .header-meta {
    display: flex; justify-content: center; gap: 20px;
    margin-top: 14px; font-size: 11px; color: var(--text-dim);
  }
  .container {
    max-width: 720px; margin: 0 auto; padding: 28px 20px 48px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 12px;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 8px;
  }
  .repo {
    font-size: 15px; font-weight: 500; color: var(--accent); text-decoration: none;
  }
  .repo:hover { text-decoration: underline; }
  .rank {
    font-size: 11px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .badges {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 3px;
    background: rgba(255,255,255,0.04); color: var(--text-dim);
  }
  .badge-stars { color: var(--gold); }
  .desc {
    font-size: 13px; color: var(--text-dim); line-height: 1.6;
    margin-bottom: 12px;
  }
  .interp {
    border-left: 2px solid var(--accent-dim);
    padding-left: 14px;
  }
  .interp p {
    font-size: 13px; color: #c8c8d8; line-height: 1.8;
  }
  .loading, .error {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim); font-size: 14px;
  }
  .error { color: #ef4444; }
  .footer {
    text-align: center; padding: 32px;
    font-size: 11px; color: var(--text-dim);
    border-top: 1px solid var(--border);
    max-width: 720px; margin: 0 auto;
  }
  .refresh-btn {
    background: var(--accent-dim); color: var(--accent);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 16px; font-size: 12px; cursor: pointer;
    margin-left: 12px;
  }
  .refresh-btn:hover { background: #1e4a7a; }

  @media (max-width: 768px) {
    .header { padding: 40px 16px 28px; }
    .header h1 { font-size: 22px; }
    .header-meta { flex-wrap: wrap; gap: 12px; }
    .container { padding: 20px 12px 36px; }
    .card { padding: 18px 16px; }
    .repo { font-size: 14px; }
    .interp p { font-size: 13px; }
  }
  @media (max-width: 420px) {
    .header h1 { font-size: 18px; }
    .card { padding: 14px 12px; }
    .repo { font-size: 13px; }
    .interp p { font-size: 12px; }
    .badges { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>GitHub Trending <span>实时解读</span></h1>
  <p class="sub" id="dateLabel">加载中...</p>
  <div class="header-meta">
    <span id="countLabel">-</span>
    <span>auto-generated</span>
    <button class="refresh-btn" onclick="fetchTrending()">Refresh</button>
  </div>
</div>

<div class="container" id="container">
  <div class="loading">正在获取 GitHub Trending 数据...</div>
</div>

<div class="footer">Hermes Agent · 每次刷新自动获取最新数据</div>

<script>
async function fetchTrending() {
  const container = document.getElementById('container');
  container.innerHTML = '<div class=\"loading\">正在获取 GitHub Trending 数据...</div>';

  try {
    // 通过 GitHub Search API 获取今日热门仓库
    // 先确定今天的日期范围
    const today = new Date();
    const dateStr = today.toISOString().split('T')[0];
    document.getElementById('dateLabel').textContent = dateStr;

    // GitHub Search API: 按 stars 排序，取最近一周创建/更新的热门项目
    const oneWeekAgo = new Date(today);
    oneWeekAgo.setDate(oneWeekAgo.getDate() - 7);
    const sinceStr = oneWeekAgo.toISOString().split('T')[0];

    const res = await fetch(
      `https://api.github.com/search/repositories?q=pushed:>${sinceStr}&sort=stars&order=desc&per_page=10`,
      { headers: { 'Accept': 'application/vnd.github.v3+json' } }
    );

    if (!res.ok) {
      throw new Error(`API 请求失败 (${res.status})`);
    }

    const data = await res.json();
    const repos = data.items;

    document.getElementById('countLabel').textContent = repos.length + ' projects';

    if (!repos || repos.length === 0) {
      container.innerHTML = '<div class=\"error\">未获取到数据，请稍后重试</div>';
      return;
    }

    let html = '';
    repos.forEach((repo, i) => {
      const desc = repo.description || '暂无描述';
      const stars = repo.stargazers_count.toLocaleString();
      const lang = repo.language || 'N/A';
      const rank = String(i + 1).padStart(2, '0');

      html += `
        <div class="card">
          <div class="card-top">
            <a class="repo" href="${repo.html_url}" target="_blank">${repo.full_name}</a>
            <span class="rank">#${rank}</span>
          </div>
          <div class="badges">
            <span class="badge">${lang}</span>
            <span class="badge badge-stars">${stars}</span>
          </div>
          <div class="desc">${desc}</div>
          <div class="interp">
            <p>${repo.full_name} 近期在 GitHub 上获得了大量关注。该项目主要使用 ${lang} 开发，累计获得 ${stars} 颗星。${desc}</p>
          </div>
        </div>
      `;
    });

    container.innerHTML = html;

  } catch (err) {
    container.innerHTML = `<div class="error">获取失败：${err.message}</div>`;
  }
}

fetchTrending();
</script>
</body>
</html>"
