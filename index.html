<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Trending 实时解读</title>
<style>
  :root {
    --bg: #0b0b12;
    --surface: #12121e;
    --border: #1e1e30;
    --text: #e2e2ee;
    --text-dim: #6b6b84;
    --accent: #38bdf8;
    --accent-dim: #1e3a5f;
    --gold: #f59e0b;
    --green: #4ade80;
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .header {
    padding: 56px 24px 40px;
    text-align: center;
    background: linear-gradient(180deg, #0f0f20 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
  }
  .header h1 { font-size: 24px; font-weight: 600; letter-spacing: -0.3px; }
  .header h1 span { color: var(--accent); }
  .header .sub { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
  .header-meta {
    display: flex; justify-content: center; gap: 20px;
    margin-top: 14px; font-size: 11px; color: var(--text-dim);
  }
  .container { max-width: 800px; margin: 0 auto; padding: 28px 20px 48px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
  }
  .card-top {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 6px;
  }
  .repo { font-size: 15px; font-weight: 500; color: var(--accent); text-decoration: none; }
  .repo:hover { text-decoration: underline; }
  .rank { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .badges { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 10px; padding: 2px 7px; border-radius: 3px;
    background: rgba(255,255,255,0.04); color: var(--text-dim);
  }
  .badge-stars { color: var(--gold); }
  .badge-forks { color: var(--green); }
  .badge-topic { background: var(--accent-dim); color: var(--accent); }
  .desc { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin-bottom: 10px; }
  .interp-title { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; margin-top: 12px; }
  .interp { border-left: 2px solid var(--accent-dim); padding-left: 14px; }
  .interp p { font-size: 13px; color: #c8c8d8; line-height: 1.8; margin-bottom: 4px; }
  .interp p:last-child { margin-bottom: 0; }
  .stats { display: flex; gap: 16px; margin-top: 12px; font-size: 11px; color: var(--text-dim); flex-wrap: wrap; }
  .placeholder-tag {
    display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 3px;
    background: #2a1a1a; color: #e88; margin-left: 8px;
  }
  .ai-tag {
    display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 3px;
    background: linear-gradient(135deg, #1e3a5f, #2d1b4e); color: #a8b8e8; margin-left: 8px;
  }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
  .error { color: #ef4444; }
  .footer { text-align: center; padding: 32px; font-size: 11px; color: var(--text-dim); border-top: 1px solid var(--border); max-width: 800px; margin: 0 auto; }
  @media (max-width: 768px) {
    .header { padding: 40px 16px 28px; }
    .header h1 { font-size: 22px; }
    .container { padding: 20px 12px 36px; }
    .card { padding: 18px 16px; }
    .repo { font-size: 14px; }
  }
  @media (max-width: 420px) {
    .header h1 { font-size: 18px; }
    .card { padding: 14px 12px; }
    .interp p { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>GitHub Trending <span>实时解读</span></h1>
  <p class="sub" id="dateLabel">2026-11-10</p>
  <div class="header-meta">
    <span id="countLabel">10 个项目</span>
    <span>由 AI 逐仓库深度解读 · 自动定期更新</span>
  </div>
</div>

<div class="container" id="container">
  <div class="loading">正在加载...</div>
</div>

<div class="footer">Hermes Agent · AI 深度解读 · GitHub Trending</div>

<script>
// ============================================================
// 预置解读数据（由 update_trending.py 根据缓存生成）
// ============================================================
const INSIGHTS = {

};

// ============================================================
// 仓库数据
// ============================================================
const REPOS = [{"name": "NotRexed/Hookshot", "stars": "5,271", "forks": "469", "lang": "C++", "rank": "01", "topics": [], "desc": "A Native Recompilation Of The Legend Of Zelda: Ocarina Of Time Nintendo Switch 2 Remake", "url": "https://github.com/NotRexed/Hookshot", "pushed": "2026-11-10T04:00:31Z", "interpreted": false}, {"name": "tangerineturtle1/NX2navi", "stars": "2,481", "forks": "163", "lang": "C", "rank": "02", "topics": [], "desc": "", "url": "https://github.com/tangerineturtle1/NX2navi", "pushed": "2026-11-10T02:40:56Z", "interpreted": false}, {"name": "huamidev/GestaltX", "stars": "2,373", "forks": "956", "lang": "Swift", "rank": "03", "topics": [], "desc": "An MobileGestalt editor for iOS 27.x, featuring region-code tweaks, device presets, backups, and support for 7 languages.", "url": "https://github.com/huamidev/GestaltX", "pushed": "2026-11-10T02:52:02Z", "interpreted": false}, {"name": "jhaizhou-ops/S2Arm", "stars": "1,974", "forks": "382", "lang": "C#", "rank": "04", "topics": ["apple-silicon", "arm64", "game-porting", "ios", "ipados"], "desc": "Run your own Switch games natively on iPhone, iPad and Mac: game code rewritten to ARM64, graphics direct to Metal, one app for the whole library. Bring your own games and keys. 把你自己的 Switch 游戏原生带到 iPhone / iPad / Mac。", "url": "https://github.com/jhaizhou-ops/S2Arm", "pushed": "2026-11-10T03:54:44Z", "interpreted": false}, {"name": "JenkinWoo/sheeridVerify", "stars": "1,952", "forks": "1,044", "lang": "JavaScript", "rank": "05", "topics": [], "desc": "", "url": "https://github.com/JenkinWoo/sheeridVerify", "pushed": "2026-11-06T09:54:37Z", "interpreted": false}, {"name": "DIYgod/pinky", "stars": "1,489", "forks": "159", "lang": "Go", "rank": "06", "topics": [], "desc": "Let AI agents use your phone, with you in the loop.", "url": "https://github.com/DIYgod/pinky", "pushed": "2026-11-10T03:52:11Z", "interpreted": false}, {"name": "IainKay/ram-altman", "stars": "1,480", "forks": "43", "lang": "Shell", "rank": "07", "topics": ["bash", "cron", "dram", "email", "humor"], "desc": "Monitors your RAM and reports any \"quite terrible\" unused capacity directly to the CEO of OpenAI.", "url": "https://github.com/IainKay/ram-altman", "pushed": "2026-11-06T15:58:11Z", "interpreted": false}, {"name": "mmdoctor/google-pro-helper", "stars": "1,456", "forks": "513", "lang": "Python", "rank": "08", "topics": [], "desc": "", "url": "https://github.com/mmdoctor/google-pro-helper", "pushed": "2026-11-05T09:41:40Z", "interpreted": false}, {"name": "livliv-dev/player", "stars": "1,413", "forks": "147", "lang": "TypeScript", "rank": "09", "topics": ["avatar", "character", "face-tracking", "lip-sync", "pngtuber"], "desc": "A lightweight 2.5D character player for the web, with lip sync and webcam face tracking.", "url": "https://github.com/livliv-dev/player", "pushed": "2026-11-09T06:08:52Z", "interpreted": false}, {"name": "voyager-so/vork", "stars": "1,300", "forks": "98", "lang": "Rust", "rank": "10", "topics": ["3d", "ai-agents", "gpu", "metal", "ray-tracing"], "desc": "Headless 3D and VFX engine for agents. Research preview.", "url": "https://github.com/voyager-so/vork", "pushed": "2026-11-09T06:09:36Z", "interpreted": false}];

// ============================================================
// 渲染页面
// ============================================================
function render() {
  const container = document.getElementById('container');
  let html = '';
  REPOS.forEach((repo, i) => {
    const insight = INSIGHTS[repo.name] || {
      summary: repo.desc || '一个值得关注的开源项目',
      details: '暂无深度解读。'
    };
    const badgeClass = repo.interpreted ? 'ai-tag' : 'placeholder-tag';
    const badgeText = repo.interpreted ? 'AI 深度解读' : '基础信息';
    html += `
      <div class="card">
        <div class="card-top">
          <a class="repo" href="${repo.url}" target="_blank">${repo.name}</a>
          <span class="rank">#${repo.rank}</span>
        </div>
        <div class="badges">
          <span class="badge">${repo.lang}</span>
          <span class="badge badge-stars">${repo.stars} ★</span>
          <span class="badge badge-forks">${repo.forks} ⑂</span>
          ${repo.topics.map(t => `<span class="badge badge-topic">${t}</span>`).join('')}
        </div>
        <div class="desc">${repo.desc}</div>
        <div class="interp-title"><span>◆</span> ${badgeText}</div>
        <div class="interp">
          <p><strong>📌 一句话：</strong>${insight.summary}</p>
          <p style="margin-top:8px; white-space:pre-wrap;">${insight.details}</p>
        </div>
        <div class="stats">
          <span>更新于 ${new Date(repo.pushed).toLocaleDateString('zh-CN')}</span>
          <a class="repo-link" href="${repo.url}" target="_blank">查看仓库 →</a>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

render();
</script>
</body>
</html>
